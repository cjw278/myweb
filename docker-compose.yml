# yvci 全栈部署编排（使用云服务器上已有的 PostgreSQL）
#
# 用法（在仓库根目录执行）：
#   docker compose up -d --build
#
# 组件：
#   - backend   FastAPI（镜像内已构建好 Vue 管理后台 /admin）
#   - frontend  Next.js（standalone 模式）
#   - nginx     统一入口，对外暴露 80 端口
#
# 数据库：直接用服务器上已部署的 PostgreSQL，
#        通过 host 网络 127.0.0.1:5432 访问，无需再起一个 db 容器。
#        连接信息（含密码）由 gitignored 的 .env 的 DATABASE_URL 提供，请勿写入本文件。
#        首次部署请在宿主机上执行一次建表+种子脚本（见部署说明）。

services:
  backend:
    build: ./yvci-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env

  frontend:
    build:
      context: ./yvci
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
